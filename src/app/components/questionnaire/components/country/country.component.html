<div class="item-selection-container center-content">
  <div class="notice">
    Let’s start creating your taste profile. Please select your preferred
    region.
  </div>

  <app-cards
    title="Choose all regions"
    [items]="countries"
    [selected]="selectedCountry$ | async | countryName"
    (selectedChange)="emitCountrySelection($event)"
  />
</div>
